<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Zcell</title>

    <!-- Typography -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav>
      <a href="/" class="logo" style="display: flex; align-items: center">
        <img
          src="/assets/images/zcell-logo.png"
          alt="Zcell Logo"
          style="
            height: 60px;
            width: 100px;
            object-fit: cover;
            object-position: center;
          "
        />
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/members/">Members</a>
        <a href="/contact/" class="active">Contact</a>
      </div>
      <button class="hamburger-menu" aria-label="Toggle navigation">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </nav>

    <!-- Contact Section -->
    <section id="contact">
      <div class="section-header" style="text-align: center; max-width: 600px">
        <span class="section-label">문의하기</span>
        <h2 class="section-title">당신의 도시를 바꿀 준비가 되셨나요?</h2>
      </div>
      <div class="contact-card">
        <h3>문의폼</h3>
        <p>Zcell Station 설치, API 구매, 파트너십 문의는 아래로 연락 주세요.</p>

        <form
          action="https://formspree.io/f/xzepbpez"
          method="POST"
          class="contact-form"
        >
          <input type="text" name="name" placeholder="이름" required />
          <input type="email" name="email" placeholder="이메일" required />
          <textarea
            name="message"
            placeholder="문의 내용"
            rows="5"
            required
          ></textarea>
          <input
            type="text"
            name="_gotcha"
            class="hp-field"
            tabindex="-1"
            autocomplete="off"
          />
          <input type="hidden" name="_subject" value="Zcell 웹사이트 문의" />
          <button type="submit" class="cta-btn">메시지 보내기</button>
        </form>
        <p class="office-address">
          지셀 사무실 주소: 한동대학교 제네시스랩 410호
        </p>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p class="footer-text">&copy; 2026 Zcell Station. All rights reserved.</p>
      <a
        href="/en/contact/"
        class="lang-slider is-ko"
        aria-label="View in English"
      >
        <span class="lang-slider-en">EN</span>
        <span class="lang-slider-ko">KOR</span>
      </a>
    </footer>

    <script>
      const hamburgerMenu = document.querySelector(".hamburger-menu");
      const navLinks = document.querySelector(".nav-links");

      if (hamburgerMenu && navLinks) {
        hamburgerMenu.addEventListener("click", () => {
          navLinks.classList.toggle("active");
        });
      }
    </script>
  </body>
</html>
