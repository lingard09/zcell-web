<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zcell - Urban Eco Platform</title>

    <!-- Typography -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav>
        <a href="/" class="logo" style="display: flex; align-items: center;">
            <img src="assets/images/zcell-logo.png" alt="Zcell Logo" style="height: 60px; width: 100px; object-fit: cover; object-position: center;">
        </a>
        <div class="nav-links">
            <a href="/" class="active">Home</a>
            <a href="/about/">About</a>
            <a href="/members/">Members</a>
            <a href="/contact/">Contact</a>
        </div>
        <button class="hamburger-menu" aria-label="Toggle navigation">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <span class="section-label" style="margin-bottom: 24px;">청정 에너지 & 환경 솔루션</span>
        <h1>도시 환경을 위한<br>지속가능한 데이터.</h1>
        <p>평범한 공공 공간을 지능형 친환경 모니터링 허브로 바꾸어 드립니다.<br />도시 인프라의 미래를 경험하세요.</p>
        <a href="https://lingard09.github.io/zcell-dashboard/" class="cta-btn" target="_blank">대시보드 보기 &rarr;</a>
    </section>

    <!-- Footer -->
    <footer>
        <p class="footer-text">&copy; 2026 Zcell Station. All rights reserved.</p>
        <a href="/en/" class="lang-slider is-ko" aria-label="View in English">
            <span class="lang-slider-en">EN</span>
            <span class="lang-slider-ko">KOR</span>
        </a>
    </footer>

    <script>
        const hamburgerMenu = document.querySelector('.hamburger-menu');
        const navLinks = document.querySelector('.nav-links');

        hamburgerMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
